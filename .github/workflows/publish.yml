name: Update data and publish Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lz-aiscope-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node scripts/update-data.mjs
      - name: Check site and data
        run: |
          node scripts/check.mjs
          node --test tests/*.test.mjs
      - name: Save dated data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public observations"
            git push
          fi
      - name: Prepare public site
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js favicon.svg .nojekyll _site/
          cp data/*.json _site/data/
          cp -R data/issues _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
